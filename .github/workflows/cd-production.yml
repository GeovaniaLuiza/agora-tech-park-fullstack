name: CD Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy and smoke test
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          for value in AWS_ROLE_ARN AWS_REGION EC2_INSTANCE_ID API_URL FRONTEND_URL RELEASE_SHA; do
            test -n "${!value}" || { echo "Missing production variable: $value"; exit 1; }
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "RELEASE_SHA must be a full 40-character commit SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "${API_URL%/}" = "${FRONTEND_URL%/}" || { echo "Production API and frontend must share the Caddy origin"; exit 1; }
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: agora-${{ github.run_id }}
      - name: Deploy joint release through Systems Manager
        run: |
          node scripts/prepare-deploy-runtime.mjs deploy > "$RUNNER_TEMP/deploy-parameters.json"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Agora $RELEASE_SHA" \
            --parameters "file://$RUNNER_TEMP/deploy-parameters.json" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)"

          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          set -e
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          test "$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status \
            --output text)" = "Success"
      - name: Production smoke tests
        run: |
          if node scripts/smoke-test.mjs; then exit 0; fi
          echo "Public smoke failed; requesting joint release rollback" >&2
          node scripts/prepare-deploy-runtime.mjs rollback > "$RUNNER_TEMP/rollback-parameters.json"
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Rollback Agora $RELEASE_SHA" \
            --parameters "file://$RUNNER_TEMP/rollback-parameters.json" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          test "$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)" = "Success"
          rollback_output="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text)"
          previous_sha="$(printf '%s\n' "$rollback_output" | sed -n 's/^ROLLBACK_SHA=//p')"
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          RELEASE_SHA="$previous_sha" node scripts/smoke-test.mjs
          echo "Smoke failed; previous joint release $previous_sha restored and verified" >&2
          exit 1
