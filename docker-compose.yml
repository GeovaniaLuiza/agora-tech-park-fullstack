services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora_indicadores
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora_dev
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora_indicadores"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate-auth-schema:
    image: node:22-bookworm-slim
    working_dir: /app/backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://agora:agora_dev@postgres:5432/agora_indicadores
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./database/migrations:/app/database/migrations:ro
      - migration_node_modules:/app/backend/node_modules
    # One owner for ordering, checksums and schema_migrations; no automatic data seed.
    # Legacy volumes without runner metadata require an explicit baseline first.
    command: [sh, -c, 'npm ci --omit=dev && npm run migrate']
    restart: "no"
volumes:
  postgres_data:
  migration_node_modules:
